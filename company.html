<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链脉 · 公司分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1119; --bg2:#0e1622; --panel:#121e2d; --panel2:#16273a;
    --line:#22344a; --border:#233852; --border2:#2e4763;
    --text:#e9eff6; --muted:#94a6bb; --faint:#63768c;
    --up:#4fc9bd; --mid:#e8a44c; --down:#b98ce6;
    --risk:#e87a6c; --warn:#e8a44c;
    --sans:'Sora',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    --cn:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--cn); background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1100px 600px at 78% -10%, rgba(79,201,189,.07), transparent 60%),
      radial-gradient(900px 700px at 8% 120%, rgba(185,140,230,.06), transparent 55%);
    min-height:100vh;
  }

  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
    padding:16px 26px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,rgba(18,30,45,.92),rgba(11,17,25,.7)); backdrop-filter:blur(10px);
  }
  .back{
    display:inline-flex; align-items:center; gap:7px;
    font-family:var(--cn); font-size:13px; color:var(--muted); cursor:pointer;
    background:var(--bg2); border:1px solid var(--border); border-radius:999px;
    padding:8px 16px; transition:all .18s ease; text-decoration:none; white-space:nowrap;
  }
  .back:hover{color:var(--text); border-color:var(--border2); background:var(--panel)}
  .back .arrow{font-family:var(--mono); font-size:15px; line-height:1}
  .co-head{display:flex; flex-direction:column; gap:3px; flex:1; min-width:0}
  .co-head .nm{font-family:var(--sans); font-size:24px; font-weight:600; line-height:1.2; letter-spacing:.3px}
  .co-head .code{font-family:var(--mono); font-size:12px; color:var(--faint); letter-spacing:1px}
  .ind-tag{
    font-size:12px; color:var(--up); background:rgba(79,201,189,.1);
    border:1px solid rgba(79,201,189,.3); border-radius:999px;
    padding:6px 13px; white-space:nowrap; font-weight:500;
  }

  .wrap{ max-width:880px; margin:0 auto; padding:30px 26px 60px; }
  .loading{ text-align:center; padding:80px 20px; color:var(--muted); font-size:15px; }
  .loading .spinner{ display:inline-block; width:28px; height:28px; border:2px solid var(--border); border-top-color:var(--up); border-radius:50%; animation:spin .8s linear infinite; margin-bottom:14px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .error-box{ text-align:center; padding:60px 20px; }
  .error-box .title{ font-size:18px; color:var(--risk); margin-bottom:10px; }
  .error-box .msg{ font-size:13px; color:var(--muted); }
  .hint-box{
    text-align:center; padding:90px 30px; color:var(--muted); line-height:1.8;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    margin-top:30px;
  }
  .hint-box .big{font-size:18px; color:var(--text); margin-bottom:10px; font-weight:500}
  .hint-box .small{font-size:13px; color:var(--faint)}
  .hint-box a{color:var(--up); text-decoration:none}
  .hint-box a:hover{text-decoration:underline}

  .sec{margin-bottom:34px}
  .sec-title{
    font-family:var(--mono); font-size:11px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--faint); margin-bottom:16px; display:flex; align-items:center; gap:9px;
  }
  .sec-title::after{content:""; flex:1; height:1px; background:var(--border)}
  .sec-title .num{
    font-family:var(--mono); font-size:10px; color:var(--up);
    border:1px solid var(--up); border-radius:4px; padding:1px 6px; letter-spacing:1px;
  }

  .crumb{
    display:flex; align-items:center; gap:11px; flex-wrap:wrap; margin-bottom:18px;
    font-size:13px;
  }
  .crumb .item{color:var(--muted)}
  .crumb .item.cur{color:var(--text); font-weight:500}
  .crumb .sep{color:var(--faint); font-family:var(--mono); font-size:11px}

  .fin-grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:11px;
  }
  .fin-card{
    background:var(--panel); border:1px solid var(--border); border-radius:11px;
    padding:16px 15px; transition:border-color .18s ease;
  }
  .fin-card:hover{border-color:var(--border2)}
  .fin-card .fk{font-size:11px; color:var(--faint); letter-spacing:.5px; margin-bottom:8px}
  .fin-card .fv{
    font-family:var(--mono); font-size:22px; font-weight:600; color:var(--text);
    line-height:1.1; letter-spacing:.3px;
  }
  .fin-card .fu{font-size:11px; color:var(--muted); margin-top:4px; letter-spacing:.3px}
  .fin-card.yoy-up .fv{color:var(--up)}
  .fin-card.yoy-down .fv{color:var(--risk)}

  .logic-box{
    background:var(--panel); border:1px solid var(--border);
    border-left:3px solid var(--up); border-radius:0 8px 8px 0;
    padding:13px 16px; margin-bottom:14px;
  }
  .logic-box .lb-title{
    font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--faint); margin-bottom:7px;
  }
  .logic-box .lb-text{font-size:14px; line-height:1.65; color:var(--text); font-weight:500}

  .risk-card{
    background:rgba(232,122,108,.07); border:1px solid rgba(232,122,108,.25);
    border-left:3px solid var(--risk); border-radius:0 8px 8px 0;
    padding:13px 16px; margin-bottom:11px;
  }
  .risk-card .rc-title{
    font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--risk); margin-bottom:7px;
  }
  .risk-card .rc-text{font-size:13px; line-height:1.6; color:var(--text)}
  .risk-list{display:flex; flex-direction:column; gap:8px}
  .risk-item{
    display:flex; align-items:flex-start; gap:9px;
    font-size:13px; color:var(--text); line-height:1.55;
    background:rgba(232,122,108,.05); border:1px solid rgba(232,122,108,.2);
    border-radius:8px; padding:10px 13px;
  }
  .risk-item .ri-dot{
    flex-shrink:0; width:6px; height:6px; border-radius:50%;
    background:var(--risk); margin-top:7px;
  }
  .risk-empty{
    text-align:center; padding:24px 20px; color:var(--faint); font-size:13px;
    font-style:italic; background:var(--panel); border:1px dashed var(--border2);
    border-radius:11px;
  }

  ::-webkit-scrollbar{width:9px; height:9px}
  ::-webkit-scrollbar-thumb{background:var(--border2); border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  @media (max-width:680px){
    .fin-grid{grid-template-columns:repeat(2,1fr)}
    .topbar{padding:14px 18px}
    .wrap{padding:24px 18px 50px}
    .co-head .nm{font-size:20px}
  }

  /* 实时行情 */
  .rt-sec{margin-bottom:24px}
  .rt-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .rt-live{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#54cf8b;background:rgba(84,207,139,.1);border:1px solid rgba(84,207,139,.3);border-radius:999px;padding:2px 8px}
  .rt-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#54cf8b;animation:pulse 2s infinite}
  .rt-live.off{color:var(--faint);background:var(--panel);border-color:var(--border2)}
  .rt-live.off::before{background:var(--faint);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .rt-ts{font-size:11px;color:var(--faint);margin-left:auto}
  .rt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
  .rt-card{background:var(--panel);border:1px solid var(--border2);border-radius:11px;padding:12px 14px}
  .rt-card .rt-k{font-size:11px;color:var(--mute);margin-bottom:4px}
  .rt-card .rt-v{font-size:17px;font-weight:700;font-family:'SF Mono','Cascadia Code',monospace}
  .rt-card .rt-v.up{color:#54cf8b}
  .rt-card .rt-v.down{color:#ec6d5f}
  .rt-card .rt-sub{font-size:10px;color:var(--faint);margin-top:3px}
  .rt-price{display:flex;align-items:baseline;gap:8px}
  .rt-price .rt-pct{font-size:13px;font-weight:600}
  .rt-loading{padding:20px;text-align:center;color:var(--faint);font-size:13px}
  .rt-err{padding:16px;text-align:center;color:var(--mute);font-size:13px;background:var(--panel);border-radius:11px;border:1px solid var(--border2)}
  .rt-earn{margin-top:16px}
  .rt-earn-tbl{width:100%;border-collapse:collapse;font-size:12px}
  .rt-earn-tbl th{text-align:left;color:var(--mute);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--border2)}
  .rt-earn-tbl td{padding:6px 8px;border-bottom:1px solid var(--border2)}
  .rt-earn-tbl td.up{color:#54cf8b}
  .rt-earn-tbl td.down{color:#ec6d5f}
  .rt-source{margin-top:12px;font-size:11px;color:var(--faint)}
</style>
</head>
<body>

<div id="root">
  <div class="loading"><div class="spinner"></div>加载中…</div>
</div>

<script src="finnhub.js"></script>
<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }

/* 产业标签 */
const IND_LABELS = {robot:'机器人产业链', ev:'新能源汽车产业链', chip:'半导体产业链', solar:'光伏产业链', bio:'生物医药产业链'};

/* 生物医药产业链节点数据(用于兜底页展示环节级投资逻辑) */
const BIO_NODES = {
  '细胞培养基与血清':{size:'约120亿',growth:'~25%',logic:'国产替代+生物药放量双驱动,价值量高',bottleneck:'无血清培养基配方与工艺 Know-how',share:[{co:'默克',v:35},{co:'赛默飞',v:25},{co:'Cytiva',v:15},{co:'奥浦迈',v:5},{co:'其他',v:20}]},
  '色谱填料/层析介质':{size:'约80亿',growth:'~30%',logic:'纯化是生物药成本大头,国产替代空间大',bottleneck:'基质合成与偶联工艺,高性能软胶',share:[{co:'Cytiva',v:40},{co:'赛多利斯',v:25},{co:'东曹',v:8},{co:'纳微科技',v:6},{co:'其他',v:21}]},
  '一次性生物耗材':{size:'约150亿',growth:'~20%',logic:'一次性技术渗透率提升,国产设备厂商受益',bottleneck:'膜材料与焊接工艺,大体积袋良率',share:[{co:'赛多利斯',v:30},{co:'默克',v:25},{co:'Cytiva',v:10},{co:'东富龙',v:8},{co:'其他',v:27}]},
  '原料药(API)':{size:'约4500亿',growth:'~8%',logic:'特色原料药+CDMO 双轮驱动,中国主导',bottleneck:'高端特色原料药工艺与合规',share:[{co:'新和成',v:8},{co:'华海药业',v:6},{co:'九州药业',v:5},{co:'普洛药业',v:5},{co:'其他',v:76}]},
  '药用辅料与包材':{size:'约600亿',growth:'~12%',logic:'中硼硅替代+集采放量,国产替代受益',bottleneck:'中硼硅玻璃管拉制工艺',share:[{co:'山东药玻',v:25},{co:'肖特',v:20},{co:'格雷斯海姆',v:12},{co:'华兰股份',v:8},{co:'其他',v:35}]},
  'CXO(CRO/CDMO)':{size:'约1500亿',growth:'~15%',logic:'工程师红利+一体化优势,地缘风险是变量',bottleneck:'海外客户信任与地缘政策',share:[{co:'药明康德',v:35},{co:'康龙化成',v:12},{co:'泰格医药',v:10},{co:'凯莱英',v:8},{co:'其他',v:35}]},
  '生物药(抗体/疫苗/CGT)':{size:'约5000亿',growth:'~18%',logic:'创新药出海+ADC 全球 licensing 热潮',bottleneck:'原创靶点与全球临床能力',share:[{co:'恒瑞医药',v:18},{co:'百济神州',v:12},{co:'信达生物',v:8},{co:'君实生物',v:5},{co:'其他',v:57}]},
  '化学药(创新药/仿制药)':{size:'约8000亿',growth:'~6%',logic:'创新转型对冲集采,龙头集中度提升',bottleneck:'创新靶点与临床转化能力',share:[{co:'恒瑞医药',v:12},{co:'石药集团',v:9},{co:'翰森制药',v:7},{co:'中国生物制药',v:6},{co:'其他',v:66}]},
  '体外诊断(IVD)':{size:'约1200亿',growth:'~15%',logic:'化学发光国产替代+集采放量',bottleneck:'化学发光试剂抗体原料与流水线整合',share:[{co:'罗氏',v:20},{co:'迈瑞医疗',v:15},{co:'安图生物',v:10},{co:'新产业',v:8},{co:'其他',v:47}]},
  '医疗器械':{size:'约8000亿',growth:'~12%',logic:'集采加速国产替代,高端设备出海',bottleneck:'高端核心部件(球管/探测器)与材料',share:[{co:'迈瑞医疗',v:12},{co:'联影医疗',v:5},{co:'微创医疗',v:4},{co:'乐普医疗',v:3},{co:'其他',v:76}]},
  '医药流通':{size:'约2.2万亿',growth:'~8%',logic:'两票制后集中度提升,国企主导',bottleneck:'',share:[{co:'国药集团',v:20},{co:'上海医药',v:12},{co:'华润医药',v:10},{co:'九州通',v:8},{co:'其他',v:50}]},
  '零售药店':{size:'约5000亿',growth:'~10%',logic:'处方外流+门诊统筹,龙头集中度提升',bottleneck:'',share:[{co:'益丰药房',v:8},{co:'大参林',v:7},{co:'老百姓',v:6},{co:'一心堂',v:5},{co:'其他',v:74}]},
  '医疗服务':{size:'约2万亿',growth:'~15%',logic:'消费医疗+第三方检验,专科连锁高成长',bottleneck:'',share:[{co:'爱尔眼科',v:5},{co:'通策医疗',v:2},{co:'金域医学',v:3},{co:'迪安诊断',v:2},{co:'其他',v:88}]},
  '创新支付':{size:'约9000亿',growth:'~20%',logic:'商保+惠民保缓解创新药支付压力,高增长',bottleneck:'',share:[]},
};

async function init(){
  const params = new URLSearchParams(location.search);
  const coName = params.get('name');
  if(!coName){
    renderHint('请从产业链页面进入', '点击下方按钮返回产业链图谱,选择企业与环节查看分析。');
    return;
  }

  const ticker = getTicker(coName);
  const meta = PHARMA_META[coName];
  const ind = params.get('ind');
  const node = params.get('node');
  const indLabel = IND_LABELS[ind] || '产业链';

  if(ticker){
    /* JPM 药企: 从 Finnhub 加载全部实时数据 */
    await renderFinnhubCompany(coName, ticker, meta, indLabel, node);
  } else if(meta){
    /* 有元数据但无 ticker */
    renderFallback(coName, indLabel, node);
  } else {
    /* 非药企: 兜底页 */
    renderFallback(coName, indLabel, node);
  }
}

async function renderFinnhubCompany(coName, ticker, meta, indLabel, node){
  const root = document.getElementById('root');
  root.innerHTML = `<div class="loading"><div class="spinner"></div>正在从 Finnhub 加载实时数据…</div>`;

  try {
    const [quote, metrics, earnings] = await Promise.all([
      fetchQuote(ticker),
      fetchMetrics(ticker),
      fetchEarnings(ticker)
    ]);

    if(!quote || !quote.price){
      renderFallback(coName, indLabel, node);
      return;
    }

    const chg = fmtChange(quote.changePct);
    const m = metrics || {};
    const mc = quote.marketCap;
    const pe = m.peTTM || quote.peTTM;
    const rev = m.revenuePerShare ? '$' + (m.revenuePerShare * quote.price / 100).toFixed(0) + '亿' : '—';
    const eps = m.epsTTM ? '$' + m.epsTTM.toFixed(2) : '—';
    const gm = m.grossMargin ? fmtPct(m.grossMargin) : '—';
    const nm = m.netMargin ? fmtPct(m.netMargin) : '—';
    const rg = m.revenueGrowth ? fmtPct(m.revenueGrowth) : '—';
    const rgClass = m.revenueGrowth >= 10 ? 'yoy-up' : (m.revenueGrowth < 3 ? 'yoy-down' : '');
    const roe = m.roe ? fmtPct(m.roe) : '—';

    /* 顶部栏 */
    let html = `<div class="topbar">
      <a class="back" href="industry.html"><span class="arrow">←</span>返回产业链</a>
      <div class="co-head">
        <div class="nm">${esc(coName)}</div>
        <div class="code">${esc(ticker)} · ${esc(quote.exchange || '')} · ${esc(quote.industry || '')}</div>
      </div>
      <span class="ind-tag">${esc(indLabel)}${node ? ' · ' + esc(node) : ''}</span>
    </div>`;

    html += `<div class="wrap">`;

    /* ===== Section 1: 实时行情 ===== */
    html += `<div class="sec rt-sec">
      <div class="sec-title"><span class="num">01</span>实时行情 <span class="rt-live">实时</span><span class="rt-ts">更新于 ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}</span></div>
      <div class="rt-grid">
        <div class="rt-card">
          <div class="rt-k">实时股价</div>
          <div class="rt-price">
            <span class="rt-v">${fmtPrice(quote.price)}</span>
            ${chg ? `<span class="rt-pct ${chg.cls}">${chg.text}</span>` : ''}
          </div>
          <div class="rt-sub">${esc(quote.exchange || '')} · ${esc(ticker)}</div>
        </div>
        <div class="rt-card"><div class="rt-k">总市值</div><div class="rt-v">${fmtMcap(mc)}</div></div>
        <div class="rt-card"><div class="rt-k">PE (TTM)</div><div class="rt-v">${pe ? pe.toFixed(1) : '—'}</div></div>
        ${quote.high ? `<div class="rt-card"><div class="rt-k">今日最高</div><div class="rt-v">${fmtPrice(quote.high)}</div></div>` : ''}
        ${quote.low ? `<div class="rt-card"><div class="rt-k">今日最低</div><div class="rt-v">${fmtPrice(quote.low)}</div></div>` : ''}
        ${quote.prevClose ? `<div class="rt-card"><div class="rt-k">前收盘</div><div class="rt-v">${fmtPrice(quote.prevClose)}</div></div>` : ''}
        ${m.high52w ? `<div class="rt-card"><div class="rt-k">52周高</div><div class="rt-v">$${m.high52w.toFixed(0)}</div></div>` : ''}
        ${m.low52w ? `<div class="rt-card"><div class="rt-k">52周低</div><div class="rt-v">$${m.low52w.toFixed(0)}</div></div>` : ''}
        ${m.beta ? `<div class="rt-card"><div class="rt-k">Beta</div><div class="rt-v">${m.beta.toFixed(2)}</div></div>` : ''}
        ${quote.dividend ? `<div class="rt-card"><div class="rt-k">股息率</div><div class="rt-v">${quote.dividend.toFixed(2)}%</div></div>` : ''}
      </div>
      <div class="rt-source">数据来源: Finnhub API · 15分钟延迟</div>
    </div>`;

    /* ===== Section 2: 财务指标(全部实时) ===== */
    html += `<div class="sec">
      <div class="sec-title"><span class="num">02</span>财务指标 (TTM · 实时)</div>
      <div class="fin-grid">
        <div class="fin-card"><div class="fk">EPS 每股收益</div><div class="fv">${esc(eps)}</div><div class="fu">TTM · 实时</div></div>
        <div class="fin-card"><div class="fk">PE 市盈率</div><div class="fv">${pe ? pe.toFixed(1) : '—'}</div><div class="fu">P/E TTM</div></div>
        <div class="fin-card ${rgClass}"><div class="fk">营收增速</div><div class="fv">${esc(rg)}</div><div class="fu">YoY · TTM</div></div>
        <div class="fin-card"><div class="fk">毛利率</div><div class="fv">${esc(gm)}</div><div class="fu">Gross Margin TTM</div></div>
        <div class="fin-card"><div class="fk">净利率</div><div class="fv">${esc(nm)}</div><div class="fu">Net Margin TTM</div></div>
        <div class="fin-card"><div class="fk">ROE</div><div class="fv">${esc(roe)}</div><div class="fu">Return on Equity</div></div>
        ${m.forwardPE ? `<div class="fin-card"><div class="fk">前瞻PE</div><div class="fv">${m.forwardPE.toFixed(1)}</div><div class="fu">Forward P/E</div></div>` : ''}
        ${m.peg ? `<div class="fin-card"><div class="fk">PEG</div><div class="fv">${m.peg.toFixed(2)}</div><div class="fu">P/E to Growth</div></div>` : ''}
        ${m.pb ? `<div class="fin-card"><div class="fk">P/B</div><div class="fv">${m.pb.toFixed(1)}</div><div class="fu">Price to Book</div></div>` : ''}
        ${m.evEbitda ? `<div class="fin-card"><div class="fk">EV/EBITDA</div><div class="fv">${m.evEbitda.toFixed(1)}</div><div class="fu">EV / EBITDA</div></div>` : ''}
        ${m.ps ? `<div class="fin-card"><div class="fk">P/S</div><div class="fv">${m.ps.toFixed(1)}</div><div class="fu">Price to Sales</div></div>` : ''}
        ${m.dividendYield != null ? `<div class="fin-card"><div class="fk">股息率</div><div class="fv">${m.dividendYield.toFixed(2)}%</div><div class="fu">Dividend Yield TTM</div></div>` : ''}
      </div>
    </div>`;

    /* ===== Section 3: 财报 EPS Surprise ===== */
    if(earnings && earnings.length){
      html += `<div class="sec">
        <div class="sec-title"><span class="num">03</span>财报 EPS Surprise</div>
        <table class="rt-earn-tbl">
          <thead><tr><th>季度</th><th>预期 EPS</th><th>实际 EPS</th><th>惊喜</th><th>营收预期</th></tr></thead>
          <tbody>`;
      earnings.slice(0, 4).forEach(e => {
        const cls = e.surprise != null ? (e.surprise >= 0 ? 'up' : 'down') : '';
        html += `<tr>
          <td>${esc(e.period || '—')}</td>
          <td>$${e.epsEstimate != null ? e.epsEstimate.toFixed(2) : '—'}</td>
          <td>$${e.actual != null ? e.actual.toFixed(2) : '—'}</td>
          <td class="${cls}">${e.surprise != null ? (e.surprise >= 0 ? '+' : '') + e.surprise.toFixed(2) : '—'}</td>
          <td>${e.revenueEstimate != null ? '$' + (e.revenueEstimate/1e9).toFixed(1) + 'B' : '—'}</td>
        </tr>`;
      });
      html += `</tbody></table>
        <div class="rt-source">数据来源: Finnhub · 最近4个季度</div>
      </div>`;
    }

    /* ===== Section 4: JPM 战略摘要 ===== */
    if(meta){
      html += `<div class="sec">
        <div class="sec-title"><span class="num">04</span>JPM 2026 战略摘要</div>
        <div class="logic-box"><div class="lb-title">战略要点</div><div class="lb-text">${esc(meta.strategy)}</div></div>`;

      if(meta.areas && meta.areas.length){
        html += `<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">
          ${meta.areas.map(a => `<span style="font-size:12px;padding:4px 12px;border-radius:999px;background:rgba(184,140,230,.12);color:var(--down);border:1px solid rgba(184,140,230,.25)">${esc(a)}</span>`).join('')}
        </div>`;
      }

      if(meta.moat){
        html += `<div class="logic-box" style="border-left-color:var(--mid)"><div class="lb-title">护城河</div><div class="lb-text">${esc(meta.moat)}</div></div>`;
      }
      html += `</div>`;

      /* ===== Section 5: 风险提示 ===== */
      if(meta.risks){
        const risks = meta.risks.split('|');
        html += `<div class="sec">
          <div class="sec-title"><span class="num">05</span>风险提示</div>
          <div class="risk-list">
            ${risks.map(r => `<div class="risk-item"><span class="ri-dot"></span><span>${esc(r)}</span></div>`).join('')}
          </div>
        </div>`;
      }
    }

    html += `</div>`;
    root.innerHTML = html;

  } catch(e) {
    root.innerHTML = `<div class="wrap"><div class="error-box">
      <div class="title">加载失败</div>
      <div class="msg">${esc(e.message || String(e))}</div>
      <div style="margin-top:20px"><a class="back" href="industry.html"><span class="arrow">←</span>返回产业链</a></div>
    </div></div>`;
  }
}

function renderHint(title, msg){
  document.getElementById('root').innerHTML = `<div class="wrap"><div class="hint-box">
    <div class="big">${esc(title)}</div>
    <div class="small">${esc(msg)}</div>
    <div style="margin-top:18px"><a class="back" href="industry.html"><span class="arrow">←</span>返回产业链</a></div>
  </div></div>`;
}

function renderFallback(coName, indLabel, node){
  const nodeData = (indLabel.includes('生物') && node) ? BIO_NODES[node] : null;
  const maxShare = nodeData && nodeData.share ? Math.max(...nodeData.share.map(s=>s.v)) : 0;

  let html = `<div class="wrap">
    <div class="topbar"><a class="back" href="industry.html"><span class="arrow">←</span>返回产业链</a></div>
    <div class="co-head">
      <div class="nm">${esc(coName)}</div>
      <div class="sub">${esc(indLabel)}${node ? ' · ' + esc(node) : ''}</div>
    </div>`;

  if(nodeData){
    html += `
    <div class="sec">
      <div class="sec-title"><span class="num">01</span>环节概览</div>
      <div class="fin-grid">
        ${nodeData.size ? `<div class="fin-card"><div class="fk">市场规模</div><div class="fv">${esc(nodeData.size)}</div></div>` : ''}
        ${nodeData.growth ? `<div class="fin-card yoy-up"><div class="fk">增速</div><div class="fv">${esc(nodeData.growth)}</div></div>` : ''}
      </div>
    </div>
    ${nodeData.logic ? `<div class="sec"><div class="sec-title"><span class="num">02</span>投资逻辑</div><div class="logic-box"><div class="lb-text">${esc(nodeData.logic)}</div></div></div>` : ''}
    ${nodeData.share && nodeData.share.length ? `<div class="sec"><div class="sec-title"><span class="num">03</span>竞争格局</div>
      ${nodeData.share.map(s => `<div class="risk-item" style="background:var(--panel);border-color:var(--border)"><span class="sr-name" style="width:110px;color:var(--muted)">${esc(s.co)}</span><span style="flex:1;height:14px;background:var(--bg2);border-radius:4px;overflow:hidden"><span style="display:block;height:100%;width:${(s.v/maxShare*100).toFixed(0)}%;background:var(--down);border-radius:4px"></span></span><span class="rt-v" style="font-size:11px;min-width:42px;text-align:right">${s.v}%</span></div>`).join('')}
    </div>` : ''}
    ${nodeData.bottleneck ? `<div class="sec"><div class="sec-title"><span class="num">04</span>核心卡点</div><div class="risk-card"><div class="rc-text">${esc(nodeData.bottleneck)}</div></div></div>` : ''}
    <div class="sec"><div class="sec-title"><span class="num">05</span>同环节其他公司</div><div class="risk-empty">该公司暂无独立财务数据。返回产业链图谱可查看该环节的完整公司列表与投资逻辑。</div></div>`;
  } else {
    html += `<div class="hint-box" style="margin:24px 0">
      <div class="big">暂无详细财务数据</div>
      <div class="small">该公司暂未收录在数据库中,可能为未上市公司或非美股标的。</div>
    </div>`;
  }

  html += `<div style="margin-top:24px"><a class="back" href="industry.html"><span class="arrow">←</span>返回产业链图谱</a></div></div>`;
  document.getElementById('root').innerHTML = html;
}

init();
</script>
</body>
</html>
