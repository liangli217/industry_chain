<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>链脉 · 产业链图谱平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b1119; --bg2:#0e1622; --panel:#121e2d; --panel2:#16273a;
    --line:#22344a; --border:#233852; --border2:#2e4763;
    --text:#e9eff6; --muted:#94a6bb; --faint:#63768c;
    --up:#4fc9bd; --mid:#e8a44c; --down:#b98ce6;
    --risk:#e87a6c;  /* 风险红 */
    --warn:#e8a44c;  /* 警示琥珀,复用 mid */
    --sans:'Sora',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    --cn:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--cn); background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    background-image:
      radial-gradient(1100px 600px at 78% -10%, rgba(79,201,189,.07), transparent 60%),
      radial-gradient(900px 700px at 8% 120%, rgba(185,140,230,.06), transparent 55%);
  }
  .app{display:flex; flex-direction:column; height:100vh; height:100dvh}

  header{
    display:flex; align-items:center; gap:22px; flex-wrap:wrap;
    padding:14px 22px; border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,rgba(18,30,45,.75),rgba(11,17,25,.4)); backdrop-filter:blur(8px);
  }
  .brand{display:flex; align-items:baseline; gap:11px; min-width:0}
  .brand .mark{font-family:var(--sans); font-weight:700; font-size:22px; letter-spacing:.5px}
  .brand .en{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:2px; text-transform:uppercase}
  .brand .tag{font-size:12px; color:var(--muted); border-left:1px solid var(--border2); padding-left:11px; margin-left:2px}

  .pills{display:flex; gap:6px; margin-left:auto; flex-wrap:wrap}
  .pill{
    font-family:var(--cn); font-size:13px; color:var(--muted); cursor:pointer;
    background:transparent; border:1px solid var(--border); border-radius:999px;
    padding:7px 15px; transition:all .18s ease; white-space:nowrap;
  }
  .pill:hover{color:var(--text); border-color:var(--border2)}
  .pill.on{color:#0b1119; background:var(--text); border-color:var(--text); font-weight:600}
  .pill:focus-visible{outline:2px solid var(--up); outline-offset:2px}

  /* 搜索框 */
  .search{position:relative; display:flex; align-items:center}
  .search input{
    background:var(--bg2); border:1px solid var(--border); border-radius:999px;
    color:var(--text); font-size:13px; padding:8px 32px 8px 15px; width:220px;
    transition:all .18s ease; font-family:var(--cn);
  }
  .search input:focus{outline:none; border-color:var(--up); box-shadow:0 0 0 3px rgba(79,201,189,.13); background:var(--panel)}
  .search input::placeholder{color:var(--faint)}
  .search .clr{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--faint); cursor:pointer; font-size:17px;
    line-height:1; padding:4px; border-radius:50%; display:none;
  }
  .search .clr:hover{color:var(--text); background:var(--border)}
  .search.has-val .clr{display:block}

  .legend{display:flex; gap:16px; align-items:center; width:100%; padding-top:2px}
  .legend .li{display:flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.5px}
  .legend .dot{width:9px; height:9px; border-radius:2px}
  .legend .note{margin-left:auto; font-size:11px; color:var(--faint)}

  .body{display:flex; flex:1; min-height:0}
  .canvas-wrap{flex:1; min-width:0; position:relative; overflow:auto}
  .canvas{position:relative; min-width:840px; padding:26px 30px 50px}

  .columns{display:grid; grid-template-columns:repeat(3,minmax(230px,1fr)); gap:60px; position:relative; z-index:2; align-items:start}
  .col-head{
    font-family:var(--mono); font-size:12px; letter-spacing:3px; text-transform:uppercase;
    display:flex; align-items:center; gap:9px; margin-bottom:18px; padding-bottom:11px;
    border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:3;
  }
  .col-head .cn{font-family:var(--cn); font-size:14px; letter-spacing:1px; font-weight:600}
  .col-head .bar{width:22px; height:3px; border-radius:2px}
  .col-head .ct{margin-left:auto; color:var(--faint); font-size:11px; letter-spacing:1px}

  .grp{font-family:var(--mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--faint);
       margin:16px 0 11px; display:flex; align-items:center; gap:8px}
  .grp:first-child{margin-top:0}
  .grp::after{content:""; flex:1; height:1px; background:var(--border)}

  .node{
    position:relative; background:var(--panel); border:1px solid var(--border);
    border-radius:11px; padding:12px 13px 11px; margin-bottom:11px; cursor:pointer;
    transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease, opacity .2s ease; overflow:hidden;
  }
  .node::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--tc); opacity:.85}
  .node:hover{transform:translateY(-1px); border-color:var(--tc); box-shadow:0 6px 22px rgba(0,0,0,.35)}
  .node .nm{font-size:14px; font-weight:600; letter-spacing:.3px; margin-bottom:3px; padding-left:4px; display:flex; align-items:center; gap:7px}
  .node .badge{font-family:var(--mono); font-size:9.5px; font-weight:600; padding:1px 5px; border-radius:4px; letter-spacing:.5px; color:var(--tc); background:var(--tc-dim); border:1px solid var(--tc)}
  .node .sub{font-size:11.5px; color:var(--muted); padding-left:4px; line-height:1.5}
  .node .chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; padding-left:4px}
  .node .chip{font-family:var(--mono); font-size:10px; color:var(--faint); background:var(--bg2); border:1px solid var(--border); border-radius:5px; padding:2px 6px; letter-spacing:.3px; transition:all .15s}
  .node a.chip{cursor:pointer; text-decoration:none; color:inherit}
  .node a.chip:hover{color:var(--text); border-color:var(--border2); background:var(--panel2)}
  .node .chip.hl{background:rgba(79,201,189,.18); border-color:var(--up); color:var(--up)}
  .node a.chip.hl:hover{background:rgba(79,201,189,.28)}
  .node a.chip.more{color:var(--warn); border-color:rgba(224,169,75,.4); background:rgba(224,169,75,.08); font-weight:600}
  .node a.chip.more:hover{background:rgba(224,169,75,.18); border-color:var(--warn)}
  .node:focus-visible{outline:2px solid var(--tc); outline-offset:2px}

  /* 节点卡片投资指标条(紧凑版) */
  .node .ind-bar{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; padding-left:4px}
  .node .ind{display:inline-flex; align-items:center; gap:5px; font-size:10px; background:var(--bg2); border:1px solid var(--border); border-radius:5px; padding:3px 7px}
  .node .ind .ik{color:var(--faint); letter-spacing:.3px}
  .node .ind .iv{font-family:var(--mono); font-weight:600; color:var(--text)}
  .node .ind.growth .iv{color:var(--up)}

  /* 链路追踪态 */
  .canvas.tracing .node{opacity:.26}
  .canvas.tracing .node.active{opacity:1}
  .node.active{border-color:var(--tc); box-shadow:0 0 0 1px var(--tc), 0 8px 26px rgba(0,0,0,.4)}
  .node.selected{box-shadow:0 0 0 2px var(--tc), 0 0 28px -6px var(--tc), 0 10px 30px rgba(0,0,0,.45)}

  /* 搜索态 */
  .canvas.searching .node{opacity:.15}
  .canvas.searching .node.matched{opacity:1; border-color:var(--up); box-shadow:0 0 0 1px var(--up), 0 6px 24px rgba(79,201,189,.22)}
  .canvas.searching.tracing .node{opacity:.15}
  .canvas.searching.tracing .node.matched{opacity:1}

  .wires{position:absolute; inset:0; z-index:1; pointer-events:none; overflow:visible}
  .wire{fill:none; stroke:var(--border2); stroke-width:1.2; opacity:.16; transition:opacity .2s, stroke-width .2s}
  .canvas.tracing .wire{opacity:.05}
  .canvas.searching .wire{opacity:.04}
  .canvas.searching .wire.matched{opacity:.65; stroke:var(--up); stroke-width:1.6}
  .wire.active{opacity:.95; stroke-width:2; stroke:var(--wc)}
  @media (prefers-reduced-motion: no-preference){
    .wire.active{stroke-dasharray:7 7; animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
  }

  .detail{width:372px; flex-shrink:0; border-left:1px solid var(--border);
    background:linear-gradient(180deg,var(--bg2),var(--bg)); display:flex; flex-direction:column}
  .detail .inner{padding:22px 22px 30px; overflow-y:auto}
  .d-eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--faint); margin-bottom:8px}
  .d-tier{display:inline-flex; align-items:center; gap:7px; font-family:var(--mono); font-size:11px; letter-spacing:1px; padding:4px 10px; border-radius:999px; margin-bottom:14px}
  .d-title{font-family:var(--sans); font-size:22px; font-weight:600; line-height:1.2; margin-bottom:11px}
  .d-desc{font-size:13px; line-height:1.7; color:var(--muted); margin-bottom:18px}

  /* 详情面板:投资指标卡 */
  .inv-card{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:18px}
  .inv-cell{background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:10px 11px}
  .inv-cell .ic-k{font-size:10px; color:var(--faint); letter-spacing:.5px; margin-bottom:4px}
  .inv-cell .ic-v{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--text); line-height:1.2}
  .inv-cell.size .ic-v{color:var(--tc)}
  .inv-cell.growth .ic-v{color:var(--up)}

  /* 详情面板:投资逻辑卡 */
  .logic-card{background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--tc); border-radius:0 8px 8px 0; padding:11px 14px; margin-bottom:18px}
  .logic-card .lc-title{font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--faint); margin-bottom:6px}
  .logic-card .lc-text{font-size:13px; line-height:1.6; color:var(--text); font-weight:500}

  .metrics{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .metric{background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:8px 11px; min-width:76px}
  .metric .mv{font-family:var(--mono); font-size:15px; font-weight:600; color:var(--tc)}
  .metric .mk{font-size:10.5px; color:var(--muted); margin-top:2px}
  .note-box{font-size:12.5px; line-height:1.66; color:var(--muted); background:var(--panel); border-left:2px solid var(--tc); border-radius:0 8px 8px 0; padding:11px 13px; margin-bottom:18px}

  /* 详情面板:竞争格局条形图 */
  .share-chart{margin-bottom:14px}
  .share-row{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:11.5px}
  .share-row .sr-name{flex-shrink:0; width:96px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .share-row .sr-track{flex:1; height:12px; background:var(--bg2); border-radius:3px; overflow:hidden}
  .share-row .sr-fill{height:100%; border-radius:3px; opacity:.85}
  .share-row .sr-val{flex-shrink:0; font-family:var(--mono); font-size:10.5px; color:var(--text); min-width:38px; text-align:right}

  /* 详情面板:卡点风险卡 */
  .risk-card{background:rgba(232,122,108,.07); border:1px solid rgba(232,122,108,.25); border-left:3px solid var(--risk); border-radius:0 8px 8px 0; padding:11px 14px; margin-bottom:18px}
  .risk-card .rc-title{font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--risk); margin-bottom:6px}
  .risk-card .rc-text{font-size:12.5px; line-height:1.6; color:var(--text)}

  .d-sec{font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--faint); margin:0 0 11px; display:flex; align-items:center; gap:8px}
  .d-sec::after{content:""; flex:1; height:1px; background:var(--border)}
  .co-list{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px}
  .co{display:inline-flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:7px 11px}
  a.co{cursor:pointer; text-decoration:none; color:inherit; transition:all .15s ease}
  a.co:hover{border-color:var(--border2); background:var(--panel2); transform:translateY(-1px)}
  .co .idx{font-family:var(--mono); font-size:10px; color:var(--faint)}
  .neighbors{display:flex; flex-direction:column; gap:16px}
  .nb-group .lbl{font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px}
  .nb-group .arrow{font-family:var(--mono); color:var(--faint)}
  .nb-chips{display:flex; flex-wrap:wrap; gap:7px}
  .nb{font-size:12px; cursor:pointer; background:var(--panel2); border:1px solid var(--border2); border-radius:7px; padding:6px 11px; color:var(--text); transition:all .15s}
  .nb:hover{border-color:var(--tc2); transform:translateY(-1px)}
  .nb::before{content:""; display:inline-block; width:7px; height:7px; border-radius:2px; background:var(--tc2); margin-right:7px; vertical-align:middle}
  .empty-hint{color:var(--faint); font-size:12.5px; font-style:italic}

  /* 概览面板 */
  .overview .ov-name{font-family:var(--sans); font-size:25px; font-weight:600; margin-bottom:6px}
  .overview .ov-sub{font-size:13px; color:var(--muted); line-height:1.7; margin-bottom:20px}
  .stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:20px}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:9px; padding:13px 12px}
  .stat .n{font-family:var(--mono); font-size:23px; font-weight:600}
  .stat .l{font-size:11px; color:var(--muted); margin-top:3px; letter-spacing:.5px}

  /* 概览:价值量分布图 */
  .val-chart{margin-bottom:22px}
  .vc-group{margin-bottom:14px}
  .vc-glabel{font-family:var(--mono); font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--faint); margin-bottom:7px}
  .vc-row{display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:11.5px}
  .vc-name{flex-shrink:0; width:104px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .vc-track{flex:1; height:14px; background:var(--bg2); border-radius:4px; overflow:hidden}
  .vc-fill{height:100%; border-radius:4px; opacity:.85}
  .vc-val{flex-shrink:0; font-family:var(--mono); font-size:11px; color:var(--text); min-width:54px; text-align:right}

  /* 概览:关键卡点 */
  .risk-list{margin-bottom:22px}
  .risk-item{background:rgba(232,122,108,.06); border:1px solid rgba(232,122,108,.22); border-left:3px solid var(--risk); border-radius:0 8px 8px 0; padding:9px 11px; margin-bottom:7px}
  .risk-item .ri-name{font-size:12px; color:var(--text); font-weight:500; margin-bottom:3px}
  .risk-item .ri-desc{font-size:11px; color:var(--muted); line-height:1.5}

  .ov-note{font-size:12.5px; line-height:1.7; color:var(--muted); background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:13px 14px; margin-bottom:20px}
  .cta-hint{display:flex; gap:10px; align-items:flex-start; font-size:12.5px; color:var(--muted); line-height:1.6; background:var(--panel); border:1px dashed var(--border2); border-radius:10px; padding:14px}
  .cta-hint .k{font-family:var(--mono); color:var(--up); flex-shrink:0}

  .close-x{margin-left:auto; cursor:pointer; color:var(--faint); font-size:20px; line-height:1; background:none; border:none; padding:4px}
  .close-x:hover{color:var(--text)}
  .d-head-row{display:flex; align-items:flex-start; gap:8px}

  ::-webkit-scrollbar{width:9px; height:9px}
  ::-webkit-scrollbar-thumb{background:var(--border2); border-radius:6px}
  ::-webkit-scrollbar-track{background:transparent}

  @media (max-width:900px){
    body{overflow:auto}
    .app{height:auto; min-height:100dvh}
    .body{flex-direction:column}
    .canvas-wrap{overflow-x:auto; overflow-y:hidden}
    .detail{width:auto; border-left:none; border-top:1px solid var(--border)}
    .legend .note{width:100%; margin:6px 0 0}
    .search{width:100%}
    .search input{width:100%}
    .inv-card{grid-template-columns:1fr 1fr}
  }

  /* ---- 供给格局 + 护城河(观点层) ---- */
  .node .top{display:flex; align-items:flex-start; gap:8px; margin-bottom:3px}
  .node .top .nm{flex:1; margin-bottom:0}
  .node .top .sup{font-size:10px; white-space:nowrap; padding-top:2px; line-height:1.35; text-align:right; max-width:104px}
  .sup{font-family:var(--mono); font-weight:600; letter-spacing:.2px}
  .sup.cn{color:#54cf8b} .sup.risk{color:#ec6d5f} .sup.race{color:#e0a94b} .sup.neutral{color:var(--faint)}
  .moat{display:flex; align-items:center; gap:7px; padding-left:4px; margin-top:8px}
  .moat .stars{font-size:12px; letter-spacing:2px; color:#e8c14a}
  .moat .stars .off{color:var(--border2)}
  .moat .ml{font-family:var(--mono); font-size:9px; letter-spacing:1.5px; color:var(--faint); text-transform:uppercase}
  .node[data-moat="3"]::after{content:""; position:absolute; top:0; left:0; right:0; height:2px; background:var(--sc,var(--tc)); opacity:.95}
  .moat-detail{display:flex; flex-direction:column; gap:10px; margin-bottom:12px}
  .md-row{display:flex; align-items:center; gap:10px; font-size:13px}
  .md-k{font-family:var(--mono); font-size:10px; letter-spacing:1px; color:var(--faint); width:60px; flex-shrink:0}
  .md-row .stars{font-size:15px; letter-spacing:2px; color:#e8c14a}
  .md-row .stars .off{color:var(--border2)}
  .md-row .ml2{font-size:12px; color:var(--muted)}
  .moat-why{font-size:12.5px; line-height:1.66; color:var(--muted); margin-bottom:18px}

  /* ---- 多层级 stage 表头 ---- */
  .col-head.stage{display:block; padding-bottom:13px}
  .col-head.stage .ch-top{display:flex; align-items:center; gap:9px}
  .col-head.stage .ch-top .cn{font-family:var(--cn); font-size:14.5px; letter-spacing:.5px; font-weight:600}
  .col-head.stage .ch-top .ct{margin-left:auto; font-family:var(--mono); color:var(--faint); font-size:11px}
  .col-head.stage .ch-sub{display:flex; align-items:center; gap:8px; margin-top:7px; padding-left:31px}
  .col-head.stage .en2{font-family:var(--mono); font-size:9px; letter-spacing:2px; color:var(--faint); text-transform:uppercase}
  .tchip{font-family:var(--cn); font-size:10px; font-weight:600; padding:1px 8px; border-radius:999px; border:1px solid; letter-spacing:.5px; line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">链脉</span>
      <span class="en">ChainMap</span>
      <span class="tag">产业链图谱平台</span>
    </div>
    <div class="pills" id="pills"></div>
    <div class="search" id="searchBox">
      <input type="text" id="searchInput" placeholder="搜索环节或企业…" autocomplete="off" spellcheck="false">
      <button class="clr" id="searchClr" title="清除搜索" aria-label="清除搜索">×</button>
    </div>
    <div class="legend">
      <span class="li"><span class="dot" style="background:var(--up)"></span>上游 · 零部件与软硬件基础</span>
      <span class="li"><span class="dot" style="background:var(--mid)"></span>中游 · 本体制造与整机集成</span>
      <span class="li"><span class="dot" style="background:var(--down)"></span>下游 · 应用场景</span>
      <span class="note">连线=供应关系　★=护城河 / 定价权强度　顶部红条=命门(海外主导/卡脖子)·绿条=中国主导　数据截至 2026 年,示例性梳理</span>
    </div>
  </header>

  <div class="body">
    <div class="canvas-wrap" id="canvasWrap">
      <div class="canvas" id="canvas">
        <svg class="wires" id="wires"></svg>
        <div class="columns" id="columns"></div>

/* ============ 工具函数 ============ */
/* 从规模字符串中解析出数值(统一换算为亿),用于条形图比例计算 */
function parseSize(s){
  if(!s) return 0;
  const m=s.match(/([\d.]+)\s*(万亿|亿|万)?/);
  if(!m) return 0;
  let v=parseFloat(m[1]);
  if(m[2]==='万亿') v*=10000;      /* 万亿 → 亿 */
  else if(m[2]==='万') v*=0.0001;  /* 万 → 亿 */
  return v;
}
/* 从百分比字符串中解析出数值 */
function parsePct(s){ if(!s) return null; const m=s.match(/([\d.]+)/); return m?parseFloat(m[1]):null; }

function idsByTier(t){ const n=DATA[current].nodes; return Object.keys(n).filter(id=>n[id].tier===t); }

/* 节点卡片投资指标条(紧凑版) */
function nodeIndBar(n){
  const parts=[];
  if(n.size) parts.push(`<span class="ind size"><span class="ik">规模</span><span class="iv">${n.size}</span></span>`);
  if(n.growth) parts.push(`<span class="ind growth"><span class="ik">增速</span><span class="iv">${n.growth}</span></span>`);
  if(!parts.length) return '';
  return `<div class="ind-bar">${parts.join('')}</div>`;
}

function renderChain(){
  colsEl.innerHTML='';
  const stages=DATA[current].stages;
  if(stages){
    /* 多 stage 分栏布局 */
    colsEl.style.gridTemplateColumns=`repeat(${stages.length}, minmax(184px,1fr))`;
    cvs.style.minWidth=(stages.length*184 + (stages.length-1)*60 + 60)+'px';
    stages.forEach(s=>{
      const T=DATA[current].tiers[s.tier];
      const col=document.createElement('div');
      const head=document.createElement('div'); head.className='col-head stage'; head.style.color=T.c;
      head.innerHTML=`<div class="ch-top"><span class="bar" style="background:${T.c}"></span><span class="cn">${s.label}</span><span class="ct">${s.ids.length}</span></div>
        <div class="ch-sub"><span class="en2">${s.en}</span><span class="tchip" style="color:${T.c};background:${dim(T.c)};border-color:${T.c}">${T.label}</span></div>`;
      col.appendChild(head);
      s.ids.forEach(id=>col.appendChild(makeNode(id, s.tier)));
      colsEl.appendChild(col);
    });
  } else {
    /* 三栏布局(按 tiers 动态列) */
    colsEl.style.gridTemplateColumns=`repeat(${Object.keys(DATA[current].tiers).length}, minmax(230px,1fr))`;
    cvs.style.minWidth=`${Object.keys(DATA[current].tiers).length*230 + (Object.keys(DATA[current].tiers).length-1)*60 + 60}px`;
    Object.keys(DATA[current].tiers).forEach(tier=>{
      const T=DATA[current].tiers[tier], ids=idsByTier(tier);
      const col=document.createElement('div');
      const head=document.createElement('div'); head.className='col-head'; head.style.color=T.c;
      head.innerHTML=`<span class="bar" style="background:${T.c}"></span><span class="cn">${T.label}</span>${T.en}<span class="ct">${ids.length} 环节</span>`;
      col.appendChild(head);
      let lastGroup=null;
      ids.forEach(id=>{
        const n=DATA[current].nodes[id];
        if(n.group && n.group!==lastGroup){ const g=document.createElement('div'); g.className='grp'; g.textContent=n.group; col.appendChild(g); lastGroup=n.group; }
        col.appendChild(makeNode(id, tier));
      });
      colsEl.appendChild(col);
    });
  }
  requestAnimationFrame(()=>{ drawWires(); applySearchToNodes(); });
}

function makeNode(id, tier){
  const n=DATA[current].nodes[id], T=DATA[current].tiers[tier];
  const el=document.createElement('div');
  el.className='node'; el.dataset.id=id; el.tabIndex=0;
  el.style.setProperty('--tc',T.c); el.style.setProperty('--tc-dim',dim(T.c));
  if(n.supc) el.style.setProperty('--sc',SUPC[n.supc]);
  if(n.moat!=null) el.dataset.moat=n.moat;
  el.innerHTML=`<div class="top"><div class="nm">${n.name}${n.badge?`<span class="badge">${n.badge}</span>`:''}</div>${n.sup?`<div class="sup ${n.supc}">${n.sup}</div>`:''}</div>
    <div class="sub">${n.sub}</div>
    ${n.moat!=null?`<div class="moat"><span class="stars">${stars(n.moat)}</span><span class="ml">护城河</span></div>`:''}
    ${nodeIndBar(n)}
    <div class="chips">${n.co.slice(0,3).map(c=>`<a class="chip" href="company.html?name=${encodeURIComponent(c)}&ind=${current}&node=${encodeURIComponent(n.name)}" onclick="event.stopPropagation()">${c}</a>`).join('')}${n.co.length>3?(id==='m6'&&current==='bio'?`<a class="chip more" href="pharma.html" onclick="event.stopPropagation()">+${n.co.length-3} 查看全部 →</a>`:`<span class="chip">+${n.co.length-3}</span>`):''}</div>`;
  el.onclick=e=>{ e.stopPropagation(); select(id); };
  el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); select(id);} };
  return el;
}

function forward(id){ const s=new Set(),q=[id]; while(q.length){const c=q.pop();(DATA[current].nodes[c].links||[]).forEach(t=>{if(!s.has(t)){s.add(t);q.push(t);}});} return s; }
function backward(id){ const n=DATA[current].nodes,s=new Set(),q=[id]; while(q.length){const c=q.pop(); for(const k in n){ if((n[k].links||[]).includes(c)&&!s.has(k)){s.add(k);q.push(k);} }} return s; }
function directParents(id){ const n=DATA[current].nodes; return Object.keys(n).filter(k=>(n[k].links||[]).includes(id)); }

function drawWires(){
  wires.innerHTML=''; const box=cvs.getBoundingClientRect(), n=DATA[current].nodes;
  let up=new Set(),down=new Set();
  if(selected){ up=backward(selected); up.add(selected); down=forward(selected); down.add(selected); }
  const searching = cvs.classList.contains('searching');
  for(const id in n){
    const from=cvs.querySelector(`.node[data-id="${id}"]`); if(!from) continue;
    const fr=from.getBoundingClientRect();
    (n[id].links||[]).forEach(tid=>{
      const to=cvs.querySelector(`.node[data-id="${tid}"]`); if(!to) return;
      const tr=to.getBoundingClientRect();
      /* 连线始终沿视觉方向绘制: 从左侧节点的右缘到右侧节点的左缘,与 links 语义方向无关 */
      const fromLeft=fr.left<=tr.left;
      const x1=(fromLeft?fr.right:tr.right)-box.left, y1=(fromLeft?fr.top:tr.top)-box.top+(fromLeft?fr.height:tr.height)/2;
      const x2=(fromLeft?tr.left:fr.left)-box.left,   y2=(fromLeft?tr.top:fr.top)-box.top+(fromLeft?tr.height:fr.height)/2;
      const dx=Math.max(40,(x2-x1)*0.5);
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      p.setAttribute('class','wire');
      p.setAttribute('d',`M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`);
      if(selected && ((up.has(id)&&up.has(tid))||(down.has(id)&&down.has(tid)))){ p.classList.add('active'); p.style.setProperty('--wc',DATA[current].tiers[n[id].tier].c); }
      /* 搜索态:两端都匹配的连线高亮 */
      if(searching && from.classList.contains('matched') && to.classList.contains('matched')){
        p.classList.add('matched');
      }
      wires.appendChild(p);
    });
  }
}

function select(id){
  selected=id;
  const up=backward(id); up.add(id); const down=forward(id); down.add(id);
  const active=new Set([...up,...down]);
  cvs.classList.add('tracing');
  cvs.querySelectorAll('.node').forEach(el=>{ el.classList.toggle('active',active.has(el.dataset.id)); el.classList.toggle('selected',el.dataset.id===id); });
  drawWires(); renderDetail();
}
function deselect(){ selected=null; cvs.classList.remove('tracing'); cvs.querySelectorAll('.node').forEach(el=>el.classList.remove('active','selected')); drawWires(); renderDetail(); }

function applySearch(){

  cvs.classList.add('searching');
  applySearchToNodes();
  drawWires();
}
/* 仅更新节点匹配态(不重绘连线),用于渲染后应用搜索 */

    el.classList.toggle('matched', isMatch);
    /* 高亮匹配的企业chip */
    const chips = el.querySelectorAll('.chip');
    chips.forEach((chip,i)=>{
      const coName = node.co[i];
      chip.classList.toggle('hl', coName && coName.toLowerCase().includes(searchQuery));
    });
  });
}

/* ============ 详情面板渲染 ============ */
function renderDetail(){
  const d=DATA[current];
  if(!selected){
    renderOverview(d);
    return;
  }
  renderNodeDetail(d);
}

/* 概览面板(未选中节点) */
function renderOverview(d){
  const nodes=d.nodes, tierKeys=Object.keys(d.tiers), t={}; Object.values(nodes).forEach(n=>{t[n.tier]=(t[n.tier]||0)+1;});
  detailEl.className='inner overview'; detailEl.style.removeProperty('--tc');

  /* 价值量分布图 */
  const valChartHtml = buildValueChart(nodes, d.tiers);
  /* 关键卡点 */
  const riskHtml = buildRiskList(nodes);

  const statsHtml = tierKeys.map(tk=>`<div class="stat"><div class="n" style="color:${d.tiers[tk].c}">${t[tk]||0}</div><div class="l">${d.tiers[tk].label}</div></div>`).join('');

  detailEl.innerHTML=`<div class="d-eyebrow">当前产业${d.short?' · '+d.short:''}</div>
    <div class="ov-name">${d.name}</div><div class="ov-sub">${d.sub}</div>
    <div class="d-sec">链路概览</div>
    <div class="stats">${statsHtml}</div>
    ${valChartHtml}
    ${riskHtml}
    ${d.note?`<div class="ov-note">${d.note}</div>`:''}
    ${d.moatNote?`<div class="ov-note" style="border-left:2px solid #e8c14a">${d.moatNote}</div>`:''}
    <div class="cta-hint"><span class="k">▶</span><span>点击任一环节,自动追踪它向上溯源、向下延伸的完整链路;其余淡出。详情里的上下游环节可继续点进,顺着链条一路走。点空白处取消。</span></div>`;
}

/* 构建价值量分布图:按 tiers 分组,组内按规模降序 */
function buildValueChart(nodes, tiers){
  const hasSize = Object.values(nodes).some(n=>n.size);
  if(!hasSize) return '';
  const tierKeys = Object.keys(tiers);
  const groups = {}; tierKeys.forEach(tk=>groups[tk]=[]);
  Object.entries(nodes).forEach(([id,n])=>{ if(n.size && groups[n.tier]) groups[n.tier].push({id,n}); });
  /* 全局最大值用于比例 */
  let maxV = 0;
  Object.values(groups).forEach(arr=>arr.forEach(({n})=>{ maxV=Math.max(maxV, parseSize(n.size)); }));
  if(maxV===0) return '';
  let html = `<div class="d-sec">价值量分布</div><div class="val-chart">`;
  tierKeys.forEach(tier=>{
    if(!groups[tier].length) return;
    const T=tiers[tier];
    groups[tier].sort((a,b)=>parseSize(b.n.size)-parseSize(a.n.size));
    html += `<div class="vc-group"><div class="vc-glabel" style="color:${T.c}">${T.label} · ${T.en}</div>`;
    groups[tier].forEach(({id,n})=>{
      const v = parseSize(n.size);
      const w = Math.max(2, (v/maxV)*100);
      html += `<div class="vc-row">
        <span class="vc-name" title="${n.name}">${n.name}</span>
        <span class="vc-track"><span class="vc-fill" style="width:${w}%;background:${T.c}"></span></span>
        <span class="vc-val">${n.size}</span>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

/* 关键卡点:有 bottleneck 字段的环节 */
function buildRiskList(nodes){
  const risks=[];
  Object.entries(nodes).forEach(([id,n])=>{ if(n.bottleneck) risks.push({id,n}); });
  if(!risks.length) return '';
  let html=`<div class="d-sec">关键卡点</div><div class="risk-list">`;
  risks.forEach(({id,n})=>{
    html += `<div class="risk-item">
      <div class="ri-name">${n.name}</div>
      <div class="ri-desc">${n.bottleneck}</div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

/* 节点详情面板(选中节点) */
function renderNodeDetail(d){
  const n=d.nodes[selected], T=d.tiers[n.tier];
  detailEl.className='inner'; detailEl.style.setProperty('--tc',T.c);

  /* 投资指标卡 */
  const invHtml = buildInvCard(n);
  /* 投资逻辑卡 */
  const logicHtml = n.logic ? `<div class="logic-card"><div class="lc-title">投资逻辑</div><div class="lc-text">${n.logic}</div></div>` : '';
  /* 竞争格局条形图 */
  const shareHtml = n.share ? `<div class="d-sec">竞争格局</div><div class="share-chart">${n.share.map(s=>`
    <div class="share-row">
      <span class="sr-name" title="${s.co}">${s.co}</span>
      <span class="sr-track"><span class="sr-fill" style="width:${s.v}%;background:${T.c}"></span></span>
      <span class="sr-val">${s.v}%</span>
    </div>`).join('')}</div>` : '';
  /* 卡点风险卡 */
  const riskHtml = n.bottleneck ? `<div class="risk-card"><div class="rc-title">卡点与风险</div><div class="rc-text">${n.bottleneck}</div></div>` : '';

  detailEl.innerHTML=`<div class="d-head-row"><div style="flex:1">
      <div class="d-eyebrow">${d.name} · 产业链环节</div>
      <span class="d-tier" style="color:${T.c};background:${dim(T.c)};border:1px solid ${T.c}"><span style="width:7px;height:7px;border-radius:2px;background:${T.c}"></span>${T.label} · ${T.en}</span>
    </div><button class="close-x" title="返回概览" onclick="event.stopPropagation();deselect()">×</button></div>
    <div class="d-title">${n.name}</div>
    <div class="d-desc">${n.sub}</div>
    ${invHtml}
    ${logicHtml}
    ${n.metrics?`<div class="metrics">${n.metrics.map(m=>`<div class="metric"><div class="mv">${m.v}</div><div class="mk">${m.k}</div></div>`).join('')}</div>`:''}
    ${n.note?`<div class="note-box">${n.note}</div>`:''}
    ${n.moat!=null?`<div class="d-sec">供给格局与护城河</div>
    <div class="moat-detail">
      <div class="md-row"><span class="md-k">供给格局</span><span class="sup ${n.supc}">${n.sup}</span></div>
      <div class="md-row"><span class="md-k">护城河</span><span class="stars">${stars(n.moat)}</span><span class="ml2">${MOATTXT[n.moat]}</span></div>
    </div>
    ${n.why?`<div class="moat-why">${n.why}</div>`:''}`:''}
    ${shareHtml}
    <div class="d-sec">代表企业 · ${n.co.length}</div>
    <div class="co-list">${n.co.map((c,i)=>`<a class="co" href="company.html?name=${encodeURIComponent(c)}&ind=${current}&node=${encodeURIComponent(n.name)}" onclick="event.stopPropagation()"><span class="idx">${String(i+1).padStart(2,'0')}</span>${c}</a>`).join('')}</div>
    ${riskHtml}
    <div class="d-sec">链路关系</div>
    <div class="neighbors">${nbGroup('上游来源','←',directParents(selected))}${nbGroup('下游去向','→',n.links||[])}</div>`;
}

/* 投资指标卡:市场规模 / 年增速 */
function buildInvCard(n){
  const cells=[];
  if(n.size) cells.push(`<div class="inv-cell size"><div class="ic-k">市场规模</div><div class="ic-v">${n.size}</div></div>`);
  if(n.growth) cells.push(`<div class="inv-cell growth"><div class="ic-k">年增速</div><div class="ic-v">${n.growth}</div></div>`);
  if(!cells.length) return '';
  return `<div class="inv-card">${cells.join('')}</div>`;
}

function nbGroup(label,arrow,ids){
  const n=DATA[current].nodes;
  const body=ids.length
    ? `<div class="nb-chips">${ids.map(id=>`<span class="nb" style="--tc2:${DATA[current].tiers[n[id].tier].c}" onclick="event.stopPropagation();select('${id}')">${n[id].name}</span>`).join('')}</div>`
    : `<div class="empty-hint">${arrow==='←'?'位于链路起点,无上游来源':'位于链路终端,无下游去向'}</div>`;
  return `<div class="nb-group"><div class="lbl"><span class="arrow">${arrow}</span>${label}</div>${body}</div>`;
}

window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(drawWires,60);});
