<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球创新药龙头 · JPM 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --border:#30363d; --border2:#21262d;
    --text:#e6edf3; --mute:#8b949e; --faint:#484f58;
    --up:#4fc9bd; --mid:#e8a44c; --down:#b98ce6; --risk:#e87a6c; --opp:#54cf8b; --warn:#e0a94b;
    --mono:'JetBrains Mono',monospace; --cn:'Noto Sans SC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Sora',var(--cn);line-height:1.6;min-height:100vh}
  a{color:inherit;text-decoration:none}

  .header{max-width:1200px;margin:0 auto;padding:32px 24px 16px}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:13px;margin-bottom:16px;transition:color .2s}
  .back:hover{color:var(--text)}
  .back::before{content:'←';font-size:16px}
  h1{font-size:28px;font-weight:700;margin-bottom:8px}
  .subtitle{color:var(--mute);font-size:15px;margin-bottom:20px}
  .stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:8px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 20px}
  .stat .k{font-size:12px;color:var(--mute);margin-bottom:4px}
  .stat .v{font-size:20px;font-weight:700}
  .stat .v.green{color:var(--opp)}
  .source{margin-top:12px;font-size:12px;color:var(--faint)}
  .source a{color:var(--warn);text-decoration:underline}

  .grid{max-width:1200px;margin:0 auto;padding:8px 24px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;gap:12px}
  .card:hover{border-color:var(--warn);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .card-name{font-size:18px;font-weight:700}
  .card-code{font-family:var(--mono);font-size:12px;color:var(--mute);background:var(--panel2);padding:2px 8px;border-radius:6px;border:1px solid var(--border2);white-space:nowrap}
  .card-meta{display:flex;gap:16px;flex-wrap:wrap}
  .meta-item{display:flex;flex-direction:column;gap:2px}
  .meta-item .k{font-size:11px;color:var(--faint)}
  .meta-item .v{font-size:14px;font-weight:600}
  .meta-item .v.up{color:var(--opp)}
  .meta-item .v.down{color:var(--risk)}
  .card-areas{display:flex;flex-wrap:wrap;gap:6px}
  .area{font-size:11px;padding:2px 10px;border-radius:999px;background:rgba(184,140,230,.12);color:var(--down);border:1px solid rgba(184,140,230,.25)}
  .card-strategy{font-size:13px;color:var(--mute);line-height:1.5;border-top:1px solid var(--border2);padding-top:10px}
  .card-arrow{display:flex;justify-content:flex-end;color:var(--faint);font-size:13px;transition:color .2s}
  .card:hover .card-arrow{color:var(--warn)}

  .rt-bar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border2);padding-top:10px;font-size:12px}
  .rt-bar .rt-l{font-size:10px;color:var(--faint);display:flex;align-items:center;gap:4px}
  .rt-bar .rt-l::before{content:'';width:6px;height:6px;border-radius:50%;background:#54cf8b;animation:blink 2s infinite}
  .rt-bar.off .rt-l::before{background:var(--faint);animation:none}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .rt-bar .rt-p{font-family:var(--mono);font-weight:600;font-size:14px}
  .rt-bar .rt-p.up{color:var(--opp)}
  .rt-bar .rt-p.down{color:var(--risk)}
  .rt-bar .rt-c{font-size:11px;color:var(--mute)}
  .rt-bar .rt-spacer{flex:1}

  .loading{text-align:center;padding:80px 24px;color:var(--mute)}
  .loading .spinner{display:inline-block;width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--warn);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .err{text-align:center;padding:80px 24px;color:var(--risk)}

  @media(max-width:600px){
    .grid{grid-template-columns:1fr;padding:8px 16px 48px}
    .header{padding:24px 16px 12px}
    h1{font-size:22px}
  }
</style>
</head>
<body>

<div class="header">
  <a class="back" href="industry.html">返回产业链</a>
  <h1>全球创新药龙头 · JPM 2026</h1>
  <div class="subtitle">2026 JPMorgan Healthcare Conference 23家全球药企战略摘要</div>
  <div class="stats" id="stats">
    <div class="stat"><div class="k">Companies</div><div class="v">23</div></div>
    <div class="stat"><div class="k">Total Market Cap</div><div class="v" id="total-mcap">Loading…</div></div>
    <div class="stat"><div class="k">Avg Rev Growth (TTM)</div><div class="v green" id="avg-growth">Loading…</div></div>
    <div class="stat"><div class="k">Avg P/E (TTM)</div><div class="v" id="avg-pe">Loading…</div></div>
  </div>
  <div class="source">Real-time data: Finnhub API · JPM strategy summary: <a href="https://liangchang.substack.com/p/i-summarized-23-global-pharma-presentations" target="_blank">liangchang.substack.com</a></div>
</div>

<div class="grid" id="grid">
  <div class="loading"><div class="spinner"></div><div>加载实时数据中…</div></div>
</div>

<script src="finnhub.js?v=3"></script>
<script>
const COMPANIES = Object.keys(TICKER_MAP);

async function load(){
  /* 先渲染卡片骨架(从 PHARMA_META 获取静态分析数据) */
  document.getElementById('grid').innerHTML = COMPANIES.map((name, i) => {
    const meta = PHARMA_META[name] || { areas:[], strategy:'', moat:'', risks:'' };
    const ticker = TICKER_MAP[name];
    const enName = meta.en || name;
    const areasEn = meta.enAreas || meta.areas || [];
    return `<a class="card" href="company.html?name=${encodeURIComponent(name)}&ind=bio&node=全球创新药龙头(JPM 23)" style="animation:fadeIn .3s ${i*0.03}s both">
      <div class="card-head">
        <div>
          <div class="card-name">${esc(enName)}</div>
          <div style="font-size:13px;color:var(--mute);margin-top:2px">${esc(name)}</div>
        </div>
        <span class="card-code">${ticker}</span>
      </div>
      <div class="card-meta">
        <div class="meta-item"><span class="k">Market Cap</span><span class="v" id="mc-${name}">—</span></div>
        <div class="meta-item"><span class="k">P/E (TTM)</span><span class="v" id="pe-${name}">—</span></div>
        <div class="meta-item"><span class="k">Rev Growth</span><span class="v" id="rg-${name}">—</span></div>
        <div class="meta-item"><span class="k">Gross Margin</span><span class="v" id="gm-${name}">—</span></div>
      </div>
      ${areasEn.length?`<div class="card-areas">${areasEn.map(a=>`<span class="area">${esc(a)}</span>`).join('')}</div>`:''}
      <div class="card-strategy">${esc(meta.enStrategy || meta.strategy)}</div>
      <div class="rt-bar off" id="rt-${name}"><span class="rt-l">Loading</span><span class="rt-spacer"></span><span class="rt-c">—</span></div>
      <div class="card-arrow">View Details →</div>
    </a>`;
  }).join('');

  /* 批量加载实时数据(quote + metrics) */
  await loadRealtimeData();
}

async function loadRealtimeData(){
  let totalMcap = 0, totalGrowth = 0, totalPE = 0, count = 0;
  const batches = [];
  for(let i=0; i<COMPANIES.length; i+=6){
    batches.push(COMPANIES.slice(i, i+6));
  }

  for(const batch of batches){
    await Promise.all(batch.map(async (name) => {
      const ticker = getTicker(name);
      if(!ticker) return;
      try {
        const [q, m] = await Promise.all([fetchQuote(ticker), fetchMetrics(ticker)]);
        if(!q) return;
        count++;
        totalMcap += q.marketCap || 0;
        totalGrowth += (m && m.revenueGrowth) || 0;
        totalPE += (m && m.peTTM) || (q && q.peTTM) || 0;

        /* 更新市值/PE/增速/毛利率 */
        const mcEl = document.getElementById('mc-'+name);
        const peEl = document.getElementById('pe-'+name);
        const rgEl = document.getElementById('rg-'+name);
        const gmEl = document.getElementById('gm-'+name);
        if(mcEl && q.marketCap) mcEl.textContent = fmtMcap(q.marketCap);
        if(peEl && m && m.peTTM) peEl.textContent = m.peTTM.toFixed(1);
        else if(peEl && q.peTTM) peEl.textContent = q.peTTM.toFixed(1);
        if(rgEl && m && m.revenueGrowth) {
          rgEl.textContent = fmtPct(m.revenueGrowth);
          rgEl.className = 'v ' + (m.revenueGrowth >= 10 ? 'up' : (m.revenueGrowth < 3 ? 'down' : ''));
        }
        if(gmEl && m && m.grossMargin) gmEl.textContent = fmtPct(m.grossMargin);

        /* 更新行情条 */
        const bar = document.getElementById('rt-'+name);
        if(bar && q.price){
          bar.classList.remove('off');
          const chg = fmtChange(q.changePct);
          bar.innerHTML = `<span class="rt-l">实时</span>
            <span class="rt-p ${chg.cls}">${fmtPrice(q.price)}</span>
            <span class="rt-c ${chg.cls}">${chg.text}</span>
            <span class="rt-spacer"></span>
            <span class="rt-c">${q.exchange || ''} · ${ticker}</span>`;
        }
      } catch(e) { console.warn(name, e); }
    }));
  }

  /* 更新顶部统计 */
  const mcStat = document.getElementById('total-mcap');
  const gStat = document.getElementById('avg-growth');
  const peStat = document.getElementById('avg-pe');
  if(mcStat) mcStat.textContent = fmtMcap(totalMcap);
  if(gStat) gStat.textContent = count ? fmtPct(totalGrowth/count) : '—';
  if(peStat) peStat.textContent = count ? (totalPE/count).toFixed(1) : '—';
}

function esc(s){return s?s.replace(/</g,'&lt;'):'';}
load();
</script>
<style>@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}</style>
</body>
</html>
